<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bay Control — logo options</title>
  <style>
    body { margin: 0; font-family: Segoe UI, sans-serif; background: #0b1f15; color: #eef6ea; padding: 32px; }
    h1 { font-weight: 600; }
    .row { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 24px; }
    figure { margin: 0; text-align: center; }
    img, object { width: 160px; height: 160px; border-radius: 28px; background: #143524; }
    figcaption { margin-top: 12px; color: #a7c4b0; }
    strong { color: #f0c75e; }
  </style>
</head>
<body>
  <h1>Bay Control logo options</h1>
  <p>Open this file in a browser. Reply with <strong>A</strong>, <strong>B</strong>, or <strong>C</strong>.</p>
  <div class="row">
    <figure>
      <img src="icon-a-pin.svg" alt="Option A pin" />
      <figcaption><strong>A — Pin</strong><br/>Flag + ball on fairway disc</figcaption>
    </figure>
    <figure>
      <img src="icon-b-bay.svg" alt="Option B bay" />
      <figcaption><strong>B — Bay</strong><br/>B-shaped bay opening + ball</figcaption>
    </figure>
    <figure>
      <img src="icon-c-green.svg" alt="Option C green" />
      <figcaption><strong>C — Green</strong><br/>Top-down green + flag</figcaption>
    </figure>
  </div>
</body>
</html>
