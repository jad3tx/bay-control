<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bay Control — C variations</title>
  <style>
    body { margin: 0; font-family: Segoe UI, sans-serif; background: #0b1f15; color: #eef6ea; padding: 32px; }
    h1 { font-weight: 600; }
    .row { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 24px; }
    figure { margin: 0; text-align: center; }
    img { width: 168px; height: 168px; border-radius: 28px; background: #143524; box-shadow: 0 12px 32px rgba(0,0,0,.35); }
    .tiny { width: 32px; height: 32px; border-radius: 8px; margin-top: 10px; }
    figcaption { margin-top: 12px; color: #a7c4b0; max-width: 180px; }
    strong { color: #f0c75e; }
  </style>
</head>
<body>
  <h1>Option C variations</h1>
  <p>Reply with <strong>C1</strong>, <strong>C2</strong>, or <strong>C3</strong>. Tiny squares show tray-size readability.</p>
  <div class="row">
    <figure>
      <img src="icon-c1-rings.svg" alt="C1 rings" />
      <img class="tiny" src="icon-c1-rings.svg" alt="" />
      <figcaption><strong>C1 — Rings</strong><br/>Concentric fairway rings + cream flag</figcaption>
    </figure>
    <figure>
      <img src="icon-c2-dusk.svg" alt="C2 dusk" />
      <img class="tiny" src="icon-c2-dusk.svg" alt="" />
      <figcaption><strong>C2 — Dusk</strong><br/>Soft sky, gold flag, cup + ball</figcaption>
    </figure>
    <figure>
      <img src="icon-c3-bold.svg" alt="C3 bold" />
      <img class="tiny" src="icon-c3-bold.svg" alt="" />
      <figcaption><strong>C3 — Bold</strong><br/>Chunkiest shapes for tiny tray icons</figcaption>
    </figure>
  </div>
</body>
</html>
